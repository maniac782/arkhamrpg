<style>
:root{
  --bg:#e9ebe4; --surface:#f7f7f2; --surface2:#dfe2d8; --ink:#1b2230; --muted:#4f5664; --line:#b8bcae;
  --brass:#7e5a12; --brass-soft:#efe3c6; --horror:#2f6b4f; --horror-soft:#d5e8dc;
  --danger:#a3322a; --danger-soft:#f4dcd8; --ok:#2f6b4f; --warn:#8a5a00; --focus:#2d5bd1;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif; --body:'Libre Franklin','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#11151c; --surface:#1a2029; --surface2:#242b36; --ink:#e8e5da; --muted:#a9adb5; --line:#3a4250;
  --brass:#d6ab52; --brass-soft:#3a3120; --horror:#63b98e; --horror-soft:#1f3a2e; --danger:#ef7c70; --danger-soft:#43221f; --ok:#63b98e; --warn:#e2b04a; --focus:#8fb0ff;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#11151c; --surface:#1a2029; --surface2:#242b36; --ink:#e8e5da; --muted:#a9adb5; --line:#3a4250;
  --brass:#d6ab52; --brass-soft:#3a3120; --horror:#63b98e; --horror-soft:#1f3a2e; --danger:#ef7c70; --danger-soft:#43221f; --ok:#63b98e; --warn:#e2b04a; --focus:#8fb0ff;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:.3px}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
main{max-width:980px;margin:0 auto;padding-block:18px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h2{font-family:var(--display);font-size:20px;margin:0;font-weight:700;text-wrap:balance}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.hor{color:var(--horror);border-color:var(--horror)}
.btn.sm{min-height:32px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{width:32px;min-height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
input.f,select.f,textarea.f{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px;border-radius:0}
.avatar{flex:none;border-radius:50%;object-fit:cover;background:var(--surface2);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--display);font-weight:700;overflow:hidden}
.avatar.lg{width:88px;height:88px;font-size:34px}.avatar.sm{width:48px;height:48px;font-size:20px}
.crop-bg{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.crop{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;width:min(340px,100%)}
.crop h2{margin:0;font-family:var(--display);font-size:20px}
.crop canvas{width:260px;height:260px;max-width:100%;border-radius:50%;touch-action:none;cursor:grab;background:var(--surface2);box-shadow:0 0 0 3px var(--brass)}
.crop canvas:active{cursor:grabbing}
.crop input[type=range]{width:100%;accent-color:var(--brass)}
.pic-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
select{background-color:var(--surface);color:var(--ink)}
select option,select optgroup{background-color:var(--surface);color:var(--ink)}
select optgroup{font-weight:700;color:var(--muted)}
select.f{appearance:none;-webkit-appearance:none;padding-right:26px;background-color:var(--surface);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea.f{border:1px solid var(--line);border-radius:4px;padding:8px;min-height:60px;resize:vertical}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--brass);outline:none}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.namein{font-family:var(--display);font-size:30px;font-weight:700;border:0;border-bottom:1px solid transparent;background:transparent;width:100%;padding:0}
.namein:focus{border-bottom-color:var(--brass);outline:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.chip.ok{background:var(--horror-soft);color:var(--ok)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--brass-soft);color:var(--warn)}
/* dice pool */
.pool{display:flex;gap:6px;flex-wrap:wrap}
.die{width:40px;height:40px;border-radius:7px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.die.reg::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.die.hor{background:var(--horror);border-color:var(--horror)}
.die.hor::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface)}
.die.empty{border-style:dashed;border-color:var(--line)}
.die.pend{border-color:var(--horror);border-style:solid;box-shadow:0 0 0 3px var(--horror-soft)}
.die.lost{border:2px solid var(--danger-soft);background:repeating-linear-gradient(45deg,var(--danger-soft) 0 4px,transparent 4px 8px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface2);border-radius:4px;min-width:110px}
.stat b{font-family:var(--mono);font-size:20px}
.stepper{display:inline-flex;align-items:center;gap:6px}
/* skills */
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.skill{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px dotted var(--line)}
.skill .nm{flex:1;font-weight:600}
.rate{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px}
.maxsel{width:58px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:4px}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tier{font-family:var(--mono);font-size:12px;border:1px solid var(--brass);color:var(--brass);border-radius:3px;padding:2px 6px;white-space:nowrap}
.effect{font-size:13px;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ammo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--ink);cursor:pointer;padding:0}
.pip.spent{background:transparent;border-color:var(--line)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);z-index:9}
.roll{border:1px solid var(--brass);background:var(--brass-soft);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
details.sec>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-family:var(--mono);font-size:20px;color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
/* party */
.party{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer}
.pcard:hover{border-color:var(--brass)}
.pcard h3{margin:0;font-family:var(--display);font-size:21px}
.mini .die{width:24px;height:24px;border-radius:5px;border-width:2px}
.mini .die::after{width:5px!important;height:5px!important}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kv div{display:flex;flex-direction:column;background:var(--surface2);border-radius:4px;padding:6px 8px}
.kv b{font-family:var(--mono);font-size:15px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.banner{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:12px 14px;font-size:14px}
.costs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:13px}
.costs span:nth-child(even){text-align:right;font-family:var(--mono)}
@media (max-width:640px){
  .skills,.party,.grid2{grid-template-columns:minmax(0,1fr)}
  .wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .namein{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function clampPool(c){

function status(c){
 if(c.injuries.some(j=>j.name==='Dead'))return['bad','Dead'];
 if(c.traumas.some(j=>j.name==='Lost Forever'))return['bad','Lost forever'];
 if(c.injuries.some(j=>j.name==='Dire'))return['bad','Dire'];
 if(c.poolLimit===0)return['bad','Wounded'];
 if(c.horrorLimit>=Math.max(3,c.poolMax/2))return['warn','Shaken'];
 if(c.poolLimit<c.poolMax||c.injuries.length)return['warn','Hurt'];
 return['ok','Steady'];
}
function poolHtml(c,mini){
 let h='',k=0;const pend=()=>k++<c.horrorLimit;
 for(let i=0;i<c.horror;i++){k++;h+='<span class="die hor" title="Horror die"></span>';}
 for(let i=0;i<c.regular;i++)h+=pend()?'<span class="die reg pend" title="Regular die \u2014 becomes a horror die on the next refill"></span>':'<span class="die reg" title="Regular die"></span>';
 for(let i=c.regular+c.horror;i<c.poolLimit;i++)h+=pend()?'<span class="die empty pend" title="Spent \u2014 refills as a horror die"></span>':'<span class="die empty" title="Spent"></span>';
 for(let i=c.poolLimit;i<c.poolMax;i++)h+='<span class="die lost" title="Lost to damage"></span>';

}

function shrinkImage(file){return new Promise((res,rej)=>{const img=new Image();const url=URL.createObjectURL(file);
 img.onload=()=>{const side=Math.min(img.width,img.height),S=320;const cv=document.createElement('canvas');cv.width=S;cv.height=S;const g=cv.getContext('2d');
  g.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,S,S);URL.revokeObjectURL(url);
  let q=0.82,d=cv.toDataURL('image/jpeg',q);while(d.length>120000&&q>0.4){q-=0.1;d=cv.toDataURL('image/jpeg',q);}res(d);};
 img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});}
function openCrop(file,slot){
 const url=URL.createObjectURL(file);const img=new Image();
 img.onerror=()=>{URL.revokeObjectURL(url);toast('Couldn\u2019t read that image. Try a JPG or PNG.');};
 img.onload=()=>{
  const V=260,OUT=320;const base=Math.max(V/img.width,V/img.height);let zoom=1,ox=0,oy=0;
  const bg=document.createElement('div');bg.className='crop-bg';bg.setAttribute('role','dialog');bg.setAttribute('aria-modal','true');bg.setAttribute('aria-label','Position portrait');
  bg.innerHTML='<div class="crop"><h2>Position your portrait</h2><canvas width="520" height="520" tabindex="0" aria-label="Drag to move the picture. Arrow keys also move it."></canvas><label class="field" style="width:100%" for="crop-zoom"><span class="lbl">Zoom</span><input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1"></label><p class="note" style="margin:0;text-align:center">Drag the picture to center it in the circle.</p><div class="row" style="justify-content:flex-end;width:100%"><button class="btn" data-c="cancel">Cancel</button><button class="btn pri" data-c="save">Save picture</button></div></div>';
  document.body.appendChild(bg);
  const cv=bg.querySelector('canvas'),g=cv.getContext('2d'),zr=bg.querySelector('#crop-zoom');
  const clamp=()=>{const sc=base*zoom,mx=Math.max(0,(img.width*sc-V)/2),my=Math.max(0,(img.height*sc-V)/2);ox=Math.min(mx,Math.max(-mx,ox));oy=Math.min(my,Math.max(-my,oy));};
  const draw=(ctx,size)=>{const k=size/V,sc=base*zoom*k,w=img.width*sc,h=img.height*sc;ctx.clearRect(0,0,size,size);ctx.drawImage(img,size/2-w/2+ox*k,size/2-h/2+oy*k,w,h);};
  const paint=()=>{clamp();draw(g,520);};paint();
  let drag=null;const pts=new Map();
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,ox,oy,zoom,dist:null};
   if(pts.size===2){const [a,b]=[...pts.values()];drag.dist=Math.hypot(a.x-b.x,a.y-b.y);}});
  cv.addEventListener('pointermove',e=>{if(!drag||!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const scale=V/cv.getBoundingClientRect().width;
   if(pts.size>=2&&drag.dist){const [a,b]=[...pts.values()];zoom=Math.min(4,Math.max(1,drag.zoom*Math.hypot(a.x-b.x,a.y-b.y)/drag.dist));zr.value=zoom;}
   else{ox=drag.ox+(e.clientX-drag.x)*scale;oy=drag.oy+(e.clientY-drag.y)*scale;}paint();});
  const up=e=>{pts.delete(e.pointerId);if(!pts.size)drag=null;else{const [a]=[...pts.values()];drag={x:a.x,y:a.y,ox,oy,zoom,dist:null};}};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(4,Math.max(1,zoom*(e.deltaY<0?1.08:1/1.08)));zr.value=zoom;paint();},{passive:false});
  cv.addEventListener('keydown',e=>{const m={ArrowLeft:[8,0],ArrowRight:[-8,0],ArrowUp:[0,8],ArrowDown:[0,-8]}[e.key];if(m){e.preventDefault();ox+=m[0];oy+=m[1];paint();}});
  zr.addEventListener('input',()=>{zoom=Number(zr.value);paint();});
  const close=()=>{bg.remove();URL.revokeObjectURL(url);document.removeEventListener('keydown',esc2);};
  const esc2=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',esc2);
  bg.addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(e.target===bg)return close();if(!b)return;
   if(b.dataset.c==='cancel')return close();
   const out=document.createElement('canvas');out.width=OUT;out.height=OUT;const og=out.getContext('2d');og.fillStyle='#ffffff';og.fillRect(0,0,OUT,OUT);draw(og,OUT);
   let q=0.82,d=out.toDataURL('image/jpeg',q);while(d.length>120000&&q>0.4){q-=0.1;d=out.toDataURL('image/jpeg',q);}
   close();save(slot,{portrait:d},'Changed portrait');});
  cv.focus();
 };
 img.src=url;
}

  case 'five':if(cr.five.includes(k))cr.five=cr.five.filter(x=>x!==k);else{if(cr.five.length>=3)return toast('Only three skills start at 5+. Tap one to unselect it first.');if(cr.four===k)cr.four='';cr.five=[...cr.five,k];}cr.ups={};break;
  case 'four':cr.four=cr.four===k?'':k;cr.five=cr.five.filter(x=>x!==k);cr.ups={};break;
  case 'up':{const r=crRating(k),cost=SKILL_COST[r];if(!cost||r-1<crFloor(k))return;if(crXpSpent()+cost>crXpBudget())return toast('Not enough XP. That costs '+cost+'.');cr.ups={...cr.ups,[k]:(cr.ups[k]||0)+1};break;}
  case 'down':cr.ups={...cr.ups,[k]:Math.max(0,(cr.ups[k]||0)-1)};break;
  case 'kbuy':{const sel=document.getElementById('cr-kbuy');if(!sel||!sel.value)return;const kk=A.knacksFor(cr.archetype).find(x=>x.name===sel.value);if(!kk)return;
   if(crTierCount(kk.tier)>=KNACK_CAP[kk.tier])return toast('Limit reached for tier '+kk.tier+'.');
   for(let t=1;t<kk.tier;t++)if(!crTierCount(t))return toast('You need a tier '+t+' knack first.');
   if(crXpSpent()+KNACK_COST[kk.tier]>crXpBudget())return toast('Not enough XP. That costs '+KNACK_COST[kk.tier]+'.');
   cr.bought=[...cr.bought,kk.name];break;}
  case 'kdel':cr.bought=cr.bought.filter(x=>x!==n);break;
  case 'cat':cr.cat=n;break;
  case 'addw':{const w=W()[Number(n)];if(crMoneySpent()+w.c>crMoneyBudget())return toast('Over budget. '+w.n+' costs '+money(w.c)+'.');cr.cart=[...cr.cart,{type:'w',n:w.n,c:w.c}];break;}
  case 'addg':{const g=GR()[Number(n)];if(crMoneySpent()+g.c>crMoneyBudget())return toast('Over budget. '+g.n+' costs '+money(g.c)+'.');cr.cart=[...cr.cart,{type:'g',n:g.n,c:g.c}];break;}
  case 'addr':{const it=cr.cart[Number(n)];const w=W().find(x=>x.n===it.n);if(crMoneySpent()+w.rc>crMoneyBudget())return toast('Over budget.');cr.cart=[...cr.cart,{type:'reload',n:w.n,c:w.rc}];break;}
  case 'rm':cr.cart=cr.cart.filter((x,i)=>i!==Number(n));break;
  case 'reset':cr=crBlank();break;
  case 'place':{if(!canEdit(cr.slot))return toast(chars[cr.slot].name+'\u2019s sheet is locked. Unlock it first.');const c=crBuild();const s=cr.slot;c.locked=!!chars[s].locked;chars[s]=norm(c,SLOTS.indexOf(s)+1);if(db)db.doc('characters/'+s).set(JSON.parse(JSON.stringify(chars[s]))).catch(e=>toast(e&&e.code==='permission-denied'?'That slot is locked. Unlock it first.':'Couldn’t save the new investigator. Try again.'));
   cr.confirm=false;crSave();toast(c.name+' joined the party.');go(s);return;}
  case 'print':downloadSheet(crBuild());return;
 }
 crSave();render();
}
function downloadSheet(c){
 const blob=new Blob([A.sheetHtml(c)],{type:'text/html'});const url=URL.createObjectURL(blob);
 const w=window.open(url,'_blank');
 if(w){toast('Sheet opened in a new tab. Use its Print button.');setTimeout(()=>URL.revokeObjectURL(url),60000);return;}
 // Pop-up blocked: fall back to saving the file.
 const a=document.createElement('a');a.href=url;a.download=(c.name||'Investigator').replace(/[^\w .-]/g,'')+' - Arkham sheet.html';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Your browser blocked the new tab, so the sheet was downloaded instead.');
}

// ---------- events ----------
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;go(b.dataset.tab);});
function go(t){active=t;try{localStorage.setItem('apl-tab',t);}catch(e){}render();window.scrollTo(0,0);}
const app=document.getElementById('app');
app.addEventListener('focusout',()=>{setTimeout(()=>{if(pending&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#app input,#app textarea,#app select')))render();},0);});
app.addEventListener('click',e=>{
 const card=e.target.closest('.pcard');if(card){go(card.dataset.tab);return;}
 if(active==='create'){const cb=e.target.closest('[data-cact]');if(cb&&!cb.disabled)creatorClick(cb);return;}
 const b=e.target.closest('[data-act]');if(!b||b.matches(':disabled'))return;const s=active,a=b.dataset.act,n=Number(b.dataset.n),c=chars[s];
 switch(a){
  case 'sessionAll':SLOTS.filter(canEdit).forEach(x=>R.newSession(x,true));toast('New session started for everyone.');break;
  case 'refillAll':SLOTS.filter(canEdit).forEach(x=>R.refill(x));toast('All pools refilled.');break;
  case 'spend':R.spend(s,b.dataset.k);break;
  case 'refill':R.refill(s);break;
  case 'dmg':R.damage(s,n);break;
  case 'heal':R.heal(s,n);break;
  case 'rest':R.rest(s);break;
  case 'strain':R.strain(s);break;
  case 'hor':R.horror(s,n);break;
  case 'habit':R.habitual(s);break;
  case 'buyhabit':R.buyHabit(s);break;
  case 'lucky':R.lucky(s);break;
  case 'ins':R.insight(s,n);break;
  case 'rinj':R.rollInjury(s);break;
  case 'rtra':R.rollTrauma(s,Math.max(1,Number(document.getElementById('ones-'+s).value)||1));break;
  case 'healinj':save(s,{injuries:c.injuries.filter(j=>j.id!==b.dataset.id)},'Healed an injury');break;
  case 'deltra':save(s,{traumas:c.traumas.filter(j=>j.id!==b.dataset.id)});break;
  case 'imp':R.improve(s,b.dataset.k);break;
  case 'xp':R.addXp(s,n);break;
  case 'xpfix':edit.xp=!edit.xp;render();break;
  case 'printc':downloadSheet(c);break;
  case 'traitxp':if(edit.trait&&c.xpUnused>=2)setTrait(s,edit.trait.t,2);break;
  case 'traitfree':if(edit.trait)setTrait(s,edit.trait.t,0);break;
  case 'traitcancel':edit.trait=null;render();break;
  case 'picdel':save(s,{portrait:''},'Removed portrait');break;
  case 'house':{const on=!house.on;if(!db){house.on=on;render();break;}db.doc('settings/house').set({on}).then(()=>toast('House rules '+(on?'on':'off')+' for the party.')).catch(()=>toast('Only the master key can change house rules.'));break;}
  case 'dellog':if(!keys.master)return;save(s,{log:(c.log||[]).filter(l=>String(l.t)!==b.dataset.n)});break;
  case 'clearlog':if(!keys.master)return;save(s,{log:[]});toast('Recent history cleared.');break;
  case 'unlock':case 'lockset':case 'lockoff':case 'forget':case 'munlock':case 'mforget':lockAction(a,s);break;
  case 'kbuy':case 'kgrant':{const sel=document.getElementById('kpick-'+s);if(!sel||!sel.value)return toast('No knacks left to choose.');const k=A.knacksFor(c.archetype).find(x=>x.name===sel.value);if(!k)return;
   if(a==='kgrant'){save(s,{knacks:[...c.knacks,{id:uid(),tier:k.tier,name:k.name,text:''}]},'Added knack '+k.name);break;}
   const have=c.knacks.filter(x=>Number(x.tier)===k.tier).length;if(have>=KNACK_CAP[k.tier])return toast('Limit reached: '+KNACK_CAP[k.tier]+' tier '+k.tier+' knack'+(KNACK_CAP[k.tier]>1?'s':'')+'.');
   for(let t=1;t<k.tier;t++)if(!c.knacks.some(x=>Number(x.tier)===t))return toast('You need a tier '+t+' knack first.');
   if(c.xpUnused<KNACK_COST[k.tier])return toast('Needs '+KNACK_COST[k.tier]+' XP.');
   save(s,{knacks:[...c.knacks,{id:uid(),tier:k.tier,name:k.name,text:''}],xpUnused:c.xpUnused-KNACK_COST[k.tier]},'Bought '+k.name+' ('+KNACK_COST[k.tier]+' XP)');break;}
  case 'gbuy':case 'gfree':{const sel=document.getElementById('gpick-'+s);if(sel)addGear(s,sel.value,a==='gbuy');break;}
  case 'buyrel':{const w=c.weapons.find(x=>x.id===b.dataset.id);if(!w||!w.rc)return;const m=Math.round(((Number(c.money)||0)-w.rc)*100)/100;if(m<0)return toast('Not enough money.');save(s,{money:m,reloads:c.reloads+1},'Bought a spare reload for '+money(w.rc));break;}
  case 'buyins':R.buyInsight(s);break;
  case 'addfree':save(s,{knacks:[...c.knacks,{id:uid(),tier:1,name:'',text:''}]});break;
  case 'del':{const l=b.dataset.list;save(s,{[l]:c[l].filter(x=>x.id!==b.dataset.id)});break;}
  case 'addw':save(s,{weapons:[...c.weapons,{id:uid(),name:'',skill:'',range:'',dmg:'',inj:'',ammoMax:0,ammo:0,special:''}]});break;
  case 'addi':save(s,{items:[...c.items,{id:uid(),name:'',note:''}]});break;
  case 'ammo':R.ammo(s,b.dataset.id,n);break;
  case 'reload':R.reload(s,b.dataset.id);break;
  case 'rel':save(s,{reloads:Math.max(0,c.reloads+n)});break;
  case 'cash':R.money(s,n);break;
  case 'cashin':case 'cashout':{const el=document.getElementById('cash-'+s);const v=Math.abs(Number(el.value)||0);if(!v)return toast('Enter an amount first.');R.money(s,a==='cashin'?v:-v);break;}
  case 'session':R.newSession(s);toast('New session: insight refilled, habitual and lucky items ready.');break;
 }
});
app.addEventListener('change',e=>{
 const el=e.target,s=active;
 if(el.dataset.pic){const f=el.files&&el.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('Choose an image file.');
  openCrop(f,s);el.value='';return;}
 if(s==='create'){
  if(el.dataset.cf){const p=el.dataset.cf;if(p.startsWith('bg.'))cr.bg={...cr.bg,[p.slice(3)]:el.value};else{cr[p]=el.value;if(p==='archetype'){cr.freeKnack='';cr.bought=[];cr.ups={};}if(p==='slot')cr.confirm=false;}}
  else if(el.dataset.cbonus){cr.bonus=el.dataset.cbonus;if(cr.bonus!=='xp'){cr.ups={};cr.bought=[];}if(cr.bonus!=='money'&&crMoneySpent()>crMoneyBudget())toast('Your gear now costs more than $50. Remove something.');}
  else if(el.dataset.cconfirm){cr.confirm=el.checked;}
  else return;
  crSave();render();return;
 }
 const c=chars[s];if(!c)return;
 if(el.dataset.trait){const t=el.value;if(c.personality&&A.TRAITS[c.personality]&&t&&t!==c.personality){edit.trait={s,t};render();}else setTrait(s,t,0);return;}
 if(el.dataset.f){const p=el.dataset.f;let v=el.value;
  if(p==='xpTotal'||p==='xpUnused')v=Math.max(0,parseInt(v)||0);
  if(p==='archetype'&&v){const sks=JSON.parse(JSON.stringify(c.skills));SKILLS.forEach(([k])=>{const f=A.maxFor(v,k);sks[k].max=f<4?String(f):'';});save(s,{archetype:v,skills:sks});return;}
  if(p.includes('.')){const [a,k]=p.split('.');const o={...c[a],[k]:v};save(s,{[a]:o});}else save(s,{[p]:v});return;}
 if(el.dataset.skmax){const sks=JSON.parse(JSON.stringify(c.skills));sks[el.dataset.skmax].max=el.value;save(s,{skills:sks});return;}
 if(el.dataset.skr){const sks=JSON.parse(JSON.stringify(c.skills));sks[el.dataset.skr].r=Number(el.value);save(s,{skills:sks});return;}
 if(el.dataset.list){const l=el.dataset.list;const arr=c[l].map(x=>({...x}));const it=arr.find(x=>x.id===el.dataset.id);if(!it)return;let v=el.value;
  if(el.dataset.key==='ammoMax'){v=Math.max(0,Math.min(12,parseInt(v)||0));it.ammo=Math.min(it.ammo,v);if(it.ammoMax===0)it.ammo=v;}
  it[el.dataset.key]=v;save(s,{[l]:arr});}
});

// ---------- passcodes ----------
async function grant(slot,code){await db.doc('grants/'+authUid+'/keys/'+slot).set({slot,code});}
async function lockAction(a,s){
 if(!db||!authUid)return toast('Still connecting. Try again in a moment.');
 const val=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
 try{
  if(a==='unlock'){const code=val('unlock-'+s);if(!code)return toast('Enter the passcode.');await grant(s,code);toast('Unlocked on this device.');}
  else if(a==='munlock'){const code=val('mkey');if(!code)return toast('Enter the master key.');await grant('master',code);toast('Master key active on this device.');}
  else if(a==='lockset'){const code=val('lockset-'+s);if(code.length<4)return toast('Use at least 4 characters.');
   await db.doc('locks/'+s).set({code});await grant(s,code);if(!chars[s].locked)await db.doc('characters/'+s).update({locked:true});toast(chars[s].locked?'Passcode set.':'Passcode changed.');}
  else if(a==='lockoff'){await db.doc('characters/'+s).update({locked:false});await db.doc('locks/'+s).delete();await db.doc('grants/'+authUid+'/keys/'+s).delete().catch(()=>{});toast('Passcode removed. Anyone can edit this sheet.');}
  else if(a==='forget'){await db.doc('grants/'+authUid+'/keys/'+s).delete();toast('This device needs the passcode again to edit.');}
  else if(a==='mforget'){await db.doc('grants/'+authUid+'/keys/master').delete();toast('Master key removed from this device.');}
 }catch(e){const code=(e&&e.code)||'unknown';console.warn('lock action failed',a,e);toast(code==='permission-denied'?(a==='munlock'?'That master key isn\u2019t right.':a==='unlock'?'Wrong passcode.':'Firebase refused that change (permission-denied). Check the site says v41 and the rules are up to date.'):'Couldn\u2019t do that ('+code+'). Try again.');}
}
function watchKeys(){
 [...SLOTS,'master'].forEach(k=>{db.doc('grants/'+authUid+'/keys/'+k).onSnapshot(snap=>{keys[k]=snap.exists;render();},()=>{keys[k]=false;});});
}

// ---------- boot ----------
render();
(async()=>{
 const syncEl=document.getElementById('sync');
 const cfg=window.FIREBASE_CONFIG;
 if(!cfg||!cfg.projectId||cfg.projectId.startsWith('PASTE')||!window.firebase){syncEl.textContent='Not connected — add your Firebase settings (see README)';return;}
 try{firebase.initializeApp(cfg);db=firebase.firestore();}catch(e){syncEl.textContent='Couldn’t connect to Firebase — check the settings';return;}
 try{const cred=await firebase.auth().signInAnonymously();authUid=cred.user.uid;}catch(e){syncEl.textContent='Sign-in failed — turn on Anonymous sign-in in Firebase (see README)';db=null;render();return;}
 watchKeys();
 db.doc('settings/house').onSnapshot(snap=>{house={on:!!(snap.exists&&snap.data().on)};render();},()=>{});
 syncEl.textContent='Live · synced for the party · v41';
 SLOTS.forEach((s,i)=>{
  const ref=db.doc('characters/'+s);let created=false;
  ref.onSnapshot(snap=>{
   if(!snap.exists){ if(!created&&!snap.metadata.fromCache){created=true;ref.set(SEED[s]||blank(i+1)).catch(()=>{});} return; }
   chars[s]=norm(JSON.parse(JSON.stringify(snap.data())),i+1);render();
  },err=>{syncEl.textContent='Sync paused — reload to reconnect';});
 });
})();
})();
