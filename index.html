<style>
:root{
  --bg:#e9ebe4; --surface:#f7f7f2; --surface2:#dfe2d8; --ink:#1b2230; --muted:#4f5664; --line:#b8bcae;
  --brass:#7e5a12; --brass-soft:#efe3c6; --horror:#2f6b4f; --horror-soft:#d5e8dc;
  --danger:#a3322a; --danger-soft:#f4dcd8; --ok:#2f6b4f; --warn:#8a5a00; --focus:#2d5bd1;
  --display:'Bodoni Moda',Didot,'Times New Roman',serif; --body:'Libre Franklin','Helvetica Neue',Arial,sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#11151c; --surface:#1a2029; --surface2:#242b36; --ink:#e8e5da; --muted:#a9adb5; --line:#3a4250;
  --brass:#d6ab52; --brass-soft:#3a3120; --horror:#63b98e; --horror-soft:#1f3a2e; --danger:#ef7c70; --danger-soft:#43221f; --ok:#63b98e; --warn:#e2b04a; --focus:#8fb0ff;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#11151c; --surface:#1a2029; --surface2:#242b36; --ink:#e8e5da; --muted:#a9adb5; --line:#3a4250;
  --brass:#d6ab52; --brass-soft:#3a3120; --horror:#63b98e; --horror-soft:#1f3a2e; --danger:#ef7c70; --danger-soft:#43221f; --ok:#63b98e; --warn:#e2b04a; --focus:#8fb0ff;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:700;font-size:24px;margin:0;letter-spacing:.3px}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:600}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}
main{max-width:980px;margin:0 auto;padding-block:18px 60px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec h2{font-family:var(--display);font-size:20px;margin:0;font-weight:700;text-wrap:balance}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lbl{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 12px;min-height:40px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.hor{color:var(--horror);border-color:var(--horror)}
.btn.sm{min-height:32px;padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{width:32px;min-height:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
input.f,select.f,textarea.f{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px;border-radius:0}
.avatar{flex:none;border-radius:50%;object-fit:cover;background:var(--surface2);border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--display);font-weight:700;overflow:hidden}
.avatar.lg{width:88px;height:88px;font-size:34px}.avatar.sm{width:48px;height:48px;font-size:20px}
.crop-bg{position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.crop{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:14px;align-items:center;width:min(340px,100%)}
.crop h2{margin:0;font-family:var(--display);font-size:20px}
.crop canvas{width:260px;height:260px;max-width:100%;border-radius:50%;touch-action:none;cursor:grab;background:var(--surface2);box-shadow:0 0 0 3px var(--brass)}
.crop canvas:active{cursor:grabbing}
.crop input[type=range]{width:100%;accent-color:var(--brass)}
.pic-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
select{background-color:var(--surface);color:var(--ink)}
select option,select optgroup{background-color:var(--surface);color:var(--ink)}
select optgroup{font-weight:700;color:var(--muted)}
select.f{appearance:none;-webkit-appearance:none;padding-right:26px;background-color:var(--surface);background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
textarea.f{border:1px solid var(--line);border-radius:4px;padding:8px;min-height:60px;resize:vertical}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--brass);outline:none}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.namein{font-family:var(--display);font-size:30px;font-weight:700;border:0;border-bottom:1px solid transparent;background:transparent;width:100%;padding:0}
.namein:focus{border-bottom-color:var(--brass);outline:none}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
.chip.ok{background:var(--horror-soft);color:var(--ok)}
.chip.bad{background:var(--danger-soft);color:var(--danger)}
.chip.warn{background:var(--brass-soft);color:var(--warn)}
/* dice pool */
.pool{display:flex;gap:6px;flex-wrap:wrap}
.die{width:40px;height:40px;border-radius:7px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.die.reg::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink)}
.die.hor{background:var(--horror);border-color:var(--horror)}
.die.hor::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface)}
.die.empty{border-style:dashed;border-color:var(--line)}
.die.pend{border-color:var(--horror);border-style:solid;box-shadow:0 0 0 3px var(--horror-soft)}
.die.lost{border:2px solid var(--danger-soft);background:repeating-linear-gradient(45deg,var(--danger-soft) 0 4px,transparent 4px 8px)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.stat{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface2);border-radius:4px;min-width:110px}
.stat b{font-family:var(--mono);font-size:20px}
.stepper{display:inline-flex;align-items:center;gap:6px}
/* skills */
.skills{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px}
.skill{display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px dotted var(--line)}
.skill .nm{flex:1;font-weight:600}
.rate{width:42px;height:42px;border-radius:50%;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:15px}
.maxsel{width:58px;border:1px solid var(--line);border-radius:4px;background:var(--surface);padding:4px}
/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tier{font-family:var(--mono);font-size:12px;border:1px solid var(--brass);color:var(--brass);border-radius:3px;padding:2px 6px;white-space:nowrap}
.effect{font-size:13px;color:var(--muted)}
.wgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ammo{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pip{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:var(--ink);cursor:pointer;padding:0}
.pip.spent{background:transparent;border-color:var(--line)}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);z-index:9}
.roll{border:1px solid var(--brass);background:var(--brass-soft);border-radius:4px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
details.sec>summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"+";font-family:var(--mono);font-size:20px;color:var(--muted)}
details.sec[open]>summary::after{content:"–"}
/* party */
.party{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;cursor:pointer}
.pcard:hover{border-color:var(--brass)}
.pcard h3{margin:0;font-family:var(--display);font-size:21px}
.mini .die{width:24px;height:24px;border-radius:5px;border-width:2px}
.mini .die::after{width:5px!important;height:5px!important}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.kv div{display:flex;flex-direction:column;background:var(--surface2);border-radius:4px;padding:6px 8px}
.kv b{font-family:var(--mono);font-size:15px}
.log{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.chip:not(.ok):not(.bad):not(.warn){background:var(--surface2);color:var(--muted)}
.turnbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--horror);background:var(--horror-soft);border-radius:6px;padding:10px 14px}
.turnbar.adv{border-color:var(--danger);background:var(--danger-soft)}
.turnbar .ph{font-weight:700;font-family:var(--display);font-size:18px}
.enemy{border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.enemy.out{opacity:.55}
.npcp{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:8px}
.skgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.skgrid span{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:4px;padding:3px 2px}
.skgrid small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.linkish{align-self:flex-start}
.clues{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.clue{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:4px}
.clue.draft{border-style:dashed}
.clue h3{margin:4px 0 0;font-family:var(--display);font-size:18px}
.handout{width:100%;border-radius:4px;margin-top:6px}
.rollout{display:flex;gap:6px;flex-wrap:wrap}
.rd{width:36px;height:36px;border-radius:7px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;opacity:.55}
.rd.s{opacity:1;box-shadow:0 0 0 3px var(--brass-soft)}
.rd.h{background:var(--horror);border-color:var(--horror);color:var(--surface)}
ul.recap{margin:4px 0 0;padding-left:18px}
@media (max-width:560px){.skgrid{grid-template-columns:repeat(5,minmax(0,1fr))}.skgrid small{font-size:9px}}
.banner{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:12px 14px;font-size:14px}
.costs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 16px;font-size:13px}
.costs span:nth-child(even){text-align:right;font-family:var(--mono)}
@media (max-width:640px){
  .skills,.party,.grid2{grid-template-columns:minmax(0,1fr)}
  .wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .namein{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

<script>
/* Catalogs from the Arkham Horror RPG corebook: names, tiers, costs and stats. Effects are short summaries. */
window.APL = (function(){
const K=s=>s.split('|').map(x=>x.trim()).filter(Boolean);
const ARCH={
 Adventurer:{three:['athletics','intuition','ranged'],two:'wits',t:[K('Brawler|Light on Your Feet|Navigator|Pulp Heroics|Scrappy|Storyteller|Strong|Treasure Hunter'),K('Awe-inspiring Display*|Dodgy|Healer|Heroic Disarm|Quick Hands|Sure-Footed|Trained|Very Strong'),K('Quick Loader|Skilled Fighter|Skilled Shot|Tracker|Trench Warfare|Very Trained'),K('Dead Lift*|Fearless*|Swing into Action*')]},
 Believer:{three:['knowledge','lore','resolve'],two:'presence',t:[K('Blinding Light|Cleanse the Spirit*|Empathetic|Helpful|Inspirational Healing*|Inspired|Instrument of Faith*|Storyteller|Symbol of Belief*'),K('Blessing of Sanctuary*|Dealer|Ear for Truth|Exile the Supernatural*|Hallowed Ground*|Healer|Very Empathetic|Wise'),K('Attune|Determination|Linguist|Scrappy|Very Wise|Ward of Protection'),K('Close Call*|Light in the Darkest Hour*|Prayer of Hope*')]},
 Guardian:{three:['melee','presence','resolve'],two:'athletics',t:[K('Brawler|Come and Get Me*|Determination|Dodgy|Fierce|Healer|Helpful|Inspired|Scrappy'),K('Rational Thinking|Set Them Up…|Skilled Fighter|Stick and Move|Strong|The Best Defense…|Trench Warfare|Very Fierce'),K('Ear for Truth|Heroic Disarm|Improved Come and Get Me*|Like a Rock*|Never Give Up*|Pulp Heroics|Very Strong'),K('Gotta Get Past Me*|Protector*')]},
 Hunter:{three:['intuition','melee','ranged'],two:'athletics',t:[K('Accurate|Ambush|Driver|Killing Blow|Quick Hands|Stick and Move|Sure-Footed|The Best Defense…|Tracker'),K('Cheap Shot|Fierce|I’ve Seen Worse*|Quick Loader|Skilled Shot|Two-Blade Fighting|Two-Pistol Fighting|Very Accurate'),K('Fast|If It Bleeds…*|Improved Tracker*|Suppressing Fire!|Very Fierce|Weak Spot'),K('Hunter’s Blind*|Slayer*|Trick Shooter*')]},
 Mystic:{three:['intuition','knowledge','presence'],two:'lore',t:[K('Blinding Light|Counterspell*|Dealer|Dodgy|Driver|Haunting Whispers*|Hypnotic Tone*|Light on Your Feet|Wise'),K('Attune|Azure Flame*|Linguist|Premonition*|Resolute|Shadows in the Eye*|Very Wise|Ward of Protection'),K('Driven by Horrors Seen*|Familiar Spirit*|Glimpses of Great Antiquity*|Mists of R’lyeh*|Storm of Spirits*|Very Resolute'),K('Banish*|Prescient*|Shrivelling*')]},
 Rogue:{three:['agility','knowledge','wits'],two:'intuition',t:[K('Ambush|Breaking and Entering*|Cheap Shot|Clever|Dodgy|Fast|Pickpocket|Quick Hands|The Best Defense…'),K('Accurate|Backstab*|Brawler|Empathic Mind|Scrappy|Stick and Move|Treasure Hunter|Very Clever'),K('Killing Blow|Known Liar*|Skilled Fighter|Storyteller|Two-Blade Fighting|Very Accurate'),K('Fade Away*|On a Roll*|Silver-Tongued*')]},
 Seeker:{three:['lore','ranged','wits'],two:'knowledge',t:[K('Brilliant Insight*|Dealer|Dodgy|Ear for Truth|Linguist|Scientific*|Smart|Sure-Footed|Weak Spot'),K('Attune|Empathetic|Empathic Mind|Storyteller|The Pen Is Mightier…*|Thinking Ahead*|Tracker|Very Smart'),K('Eat Lead!|Helpful|Killing Blow|Rational Thinking|Two-Pistol Fighting|Very Empathetic'),K('Flawless Memory*|I Have a Hunch*|Nosy Questions*')]},
 Survivor:{three:['athletics','intuition','melee'],two:'resolve',t:[K('Dealer|Eat Lead!|Fast|Light on Your Feet|Navigator|Nope!*|Quick Hands|Resolute|Scrappy'),K('Clever|Determination|Dodgy|Helpful|Set Them Up…|Suppressing Fire!|Trench Warfare|Very Resolute'),K('Empathic Mind|Pickpocket|Pulp Heroics|Skilled Fighter|Skilled Shot|Very Clever'),K('Last One Standing*|Not Done Yet*|Tough as Iron*')]},
};
// Knack effects: short summaries of the corebook rules, in our own words.
const KT={
// Adventurer unique
'Awe-inspiring Display':'Once per session, after a successful reaction against an attack or trap, everyone within 20 ft rolls a Resolve reaction. Those who fail or skip it take −1 per die on actions and reactions against you until the scene ends.',
'Dead Lift':'Once per scene, an Athletics attack lets you lift an engaged character and throw them up to 10 ft: they land prone with 1 damage and an injury (and so does anyone they land on). With 3+ successes they can’t react to avoid it.',
'Fearless':'When a 6 on a complex action triggers nothing else, you may lower your horror dice limit by 1.',
'Swing into Action':'Once per scene, a complex Athletics action swings you to anywhere within 50 ft on a rope, whip, vine, wire or chandelier. Raise the difficulty once to carry a passenger, or grab an object or person on the way with an Athletics reaction.',
// Believer unique
'Blessing of Sanctuary':'Faith. Complex Lore action: supernatural creatures can’t come within 5 ft of you (+5 ft per extra success); any already there take 1 damage and are pushed out. Keep it up with a simple action each turn. A creature can break it with a difficult Resolve action.',
'Cleanse the Spirit':'Faith. Once per session, complex Lore action on an engaged character: lower their horror dice limit by 1 per success. If you fail, you suffer 1 horror.',
'Close Call':'Faith. Once per session, when you’re dealt an injury you may avoid it and suffer 2 horror instead.',
'Exile the Supernatural':'Faith. Once per scene, complex Resolve action on an engaged character who is possessed or supernaturally influenced: they get a Resolve reaction to shake it off, +1 to their die per extra success.',
'Hallowed Ground':'Faith. Once per session, complex Lore action: the ground around you (10 ft across per success) is hallowed until the end of your next turn. Supernatural and otherworldly creatures on it attack with disadvantage.',
'Inspirational Healing':'Faith. Complex Lore action on yourself or someone within 10 ft: heal up to 3 damage. With 3+ successes they also add dice to their pool equal to the damage healed.',
'Instrument of Faith':'Faith. Once per session, a simple action blesses a weapon for the scene: attacks with it that roll any 6s deal +1 damage.',
'Light in the Darkest Hour':'Faith. Once per session, before the investigators’ turn: until your next turn, you and every ally in the scene ignore all injuries and traumas and can’t suffer new ones.',
'Prayer of Hope':'Faith. Once per scene, complex Presence action: per success, allies within 20 ft heal 1 damage and lower their horror dice limit by 1. With 3+ successes, allies also get advantage on complex actions for the rest of this turn.',

function knackText(n){return KT[String(n||'').trim()]||'';}
// knack table for an archetype: [{name,tier,unique,text}]
function knacksFor(a){const d=ARCH[a];if(!d)return[];const out=[];d.t.forEach((list,i)=>list.forEach(n=>{const nm=n.replace(/\*$/,'');out.push({name:nm,tier:i+1,unique:n.endsWith('*'),text:knackText(nm)});}));return out;}
function maxFor(a,k){const d=ARCH[a];if(!d)return 4;if(d.two===k)return 2;if(d.three.includes(k))return 3;return 4;}

}

function status(c){

}

function openCrop(file,slot){
 const url=URL.createObjectURL(file);const img=new Image();
 img.onerror=()=>{URL.revokeObjectURL(url);toast('Couldn\u2019t read that image. Try a JPG or PNG.');};
 img.onload=()=>{
  const V=260,OUT=320;const base=Math.max(V/img.width,V/img.height);let zoom=1,ox=0,oy=0;
  const bg=document.createElement('div');bg.className='crop-bg';bg.setAttribute('role','dialog');bg.setAttribute('aria-modal','true');bg.setAttribute('aria-label','Position portrait');
  bg.innerHTML='<div class="crop"><h2>Position your portrait</h2><canvas width="520" height="520" tabindex="0" aria-label="Drag to move the picture. Arrow keys also move it."></canvas><label class="field" style="width:100%" for="crop-zoom"><span class="lbl">Zoom</span><input type="range" id="crop-zoom" min="1" max="4" step="0.01" value="1"></label><p class="note" style="margin:0;text-align:center">Drag the picture to center it in the circle.</p><div class="row" style="justify-content:flex-end;width:100%"><button class="btn" data-c="cancel">Cancel</button><button class="btn pri" data-c="save">Save picture</button></div></div>';
  document.body.appendChild(bg);
  const cv=bg.querySelector('canvas'),g=cv.getContext('2d'),zr=bg.querySelector('#crop-zoom');
  const clamp=()=>{const sc=base*zoom,mx=Math.max(0,(img.width*sc-V)/2),my=Math.max(0,(img.height*sc-V)/2);ox=Math.min(mx,Math.max(-mx,ox));oy=Math.min(my,Math.max(-my,oy));};
  const draw=(ctx,size)=>{const k=size/V,sc=base*zoom*k,w=img.width*sc,h=img.height*sc;ctx.clearRect(0,0,size,size);ctx.drawImage(img,size/2-w/2+ox*k,size/2-h/2+oy*k,w,h);};
  const paint=()=>{clamp();draw(g,520);};paint();
  let drag=null;const pts=new Map();
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});drag={x:e.clientX,y:e.clientY,ox,oy,zoom,dist:null};
   if(pts.size===2){const [a,b]=[...pts.values()];drag.dist=Math.hypot(a.x-b.x,a.y-b.y);}});
  cv.addEventListener('pointermove',e=>{if(!drag||!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});const scale=V/cv.getBoundingClientRect().width;
   if(pts.size>=2&&drag.dist){const [a,b]=[...pts.values()];zoom=Math.min(4,Math.max(1,drag.zoom*Math.hypot(a.x-b.x,a.y-b.y)/drag.dist));zr.value=zoom;}
   else{ox=drag.ox+(e.clientX-drag.x)*scale;oy=drag.oy+(e.clientY-drag.y)*scale;}paint();});
  const up=e=>{pts.delete(e.pointerId);if(!pts.size)drag=null;else{const [a]=[...pts.values()];drag={x:a.x,y:a.y,ox,oy,zoom,dist:null};}};

  cv.addEventListener('keydown',e=>{const m={ArrowLeft:[8,0],ArrowRight:[-8,0],ArrowUp:[0,8],ArrowDown:[0,-8]}[e.key];if(m){e.preventDefault();ox+=m[0];oy+=m[1];paint();}});
  zr.addEventListener('input',()=>{zoom=Number(zr.value);paint();});
  const close=()=>{bg.remove();URL.revokeObjectURL(url);document.removeEventListener('keydown',esc2);};
  const esc2=e=>{if(e.key==='Escape')close();};document.addEventListener('keydown',esc2);

   if(b.dataset.c==='cancel')return close();
   const out=document.createElement('canvas');out.width=OUT;out.height=OUT;const og=out.getContext('2d');og.fillStyle='#ffffff';og.fillRect(0,0,OUT,OUT);draw(og,OUT);
   let q=0.82,d=out.toDataURL('image/jpeg',q);while(d.length>120000&&q>0.4){q-=0.1;d=out.toDataURL('image/jpeg',q);}
   close();save(slot,{portrait:d},'Changed portrait');});
  cv.focus();
 };

}

function crXpBudget(){return cr.bonus==='xp'?5:0;}
function crKnackCost(){return cr.bought.reduce((s,n)=>{const k=A.knacksFor(cr.archetype).find(x=>x.name===n);return s+(k?KNACK_COST[k.tier]:0);},0);}
function crXpSpent(){return SKILLS.reduce((s,[k])=>s+crUpCost(k),0)+crKnackCost();}
function crMoneyBudget(){return 50+(cr.bonus==='money'?100:0);}
function crCost(it){return it.type==='reload'?it.c:it.c;}
function crMoneySpent(){return Math.round(cr.cart.reduce((s,it)=>s+it.c,0)*100)/100;}
function crKnackList(){const all=[];if(cr.freeKnack)all.push(cr.freeKnack);return all.concat(cr.bought);}
function crTierCount(t){return crKnackList().filter(n=>{const k=A.knacksFor(cr.archetype).find(x=>x.name===n);return k&&k.tier===t;}).length;}
function crChecks(){
 const c=[];
 c.push([!!cr.name.trim(),'Name the investigator']);
 c.push([!!cr.trait,'Choose a personality trait']);
 c.push([!!cr.archetype,'Choose an archetype']);
 c.push([cr.five.length===3,'Raise three skills to 5+ ('+cr.five.length+' of 3)']);
 c.push([!!cr.four,'Raise one skill to 4+']);
 c.push([!!cr.bonus,'Pick an extra advancement']);
 c.push([!!cr.freeKnack,'Choose the free tier 1 knack']);
 c.push([crXpSpent()<=crXpBudget(),'Stay within your XP']);
 c.push([crMoneySpent()<=crMoneyBudget(),'Stay within your gear budget']);
 return c;
}
function crBuild(){
 const skills={};SKILLS.forEach(([k])=>{const f=crFloor(k);skills[k]={r:crRating(k),max:f<4?String(f):''};});
 const t=A.TRAITS[cr.trait]||['',''];
 const kn=A.knacksFor(cr.archetype);
 const knacks=crKnackList().map(n=>{const k=kn.find(x=>x.name===n);return {id:uid(),tier:k?k.tier:1,name:n,text:A.knackText(n)};});
 const weapons=[],items=[],vehicles=[];let reloads=0,habitual={name:'',used:false,uses:0};
 cr.cart.forEach(it=>{
  if(it.type==='w'){const w=W().find(x=>x.n===it.n);if(w)weapons.push({id:uid(),name:w.n,skill:w.s,range:w.r,dmg:w.d,inj:w.i,ammoMax:w.a,ammo:w.a,reloads:0,rc:w.rc,fr:!!w.fr,special:w.sp});}
  else if(it.type==='reload'){const g=weapons.find(x=>x.name===it.n);if(g)g.reloads++;else reloads++;}
  else if(it.n==='Habitual Item')habitual={name:'Habitual item',used:false,uses:habitual.uses+1};
  else{const g=GR().find(x=>x.n===it.n);if(g&&g.cat==='Transport'){vehicles.push(it.n);return;}items.push({id:uid(),name:it.n,note:g?g.note:''});}
 });
 const xp=crXpBudget();
 const b=blank(1);
 return Object.assign(b,{name:cr.name.trim(),player:cr.player,archetype:cr.archetype,personality:cr.trait,positive:t[0],negative:t[1],
  xpTotal:xp,xpUnused:xp-crXpSpent(),skills,insightLimit:cr.bonus==='insight'?2:1,insight:cr.bonus==='insight'?2:1,
  knacks,weapons,items,reloads,habitual,money:Math.round((crMoneyBudget()-crMoneySpent())*100)/100,
  bg:Object.assign(b.bg,cr.bg,vehicles.length?{vehicle:[cr.bg.vehicle,...vehicles].filter(Boolean).join(', ')}:{}),log:[{t:Date.now(),m:'Created in the ledger'}]});
}

function creatorClick(b){
 const a=b.dataset.cact,k=b.dataset.k,n=b.dataset.n;
 switch(a){
  case 'five':case 'four':{
   if(a==='five'&&!cr.five.includes(k)&&cr.five.length>=3)return toast('Only three skills start at 5+. Tap one to unselect it first.');
   const touched=[k];if(a==='four'&&cr.four&&cr.four!==k)touched.push(cr.four);
   let refund=0;touched.forEach(x=>{if(cr.ups[x])refund+=crUpCost(x);});
   if(a==='five'){if(cr.five.includes(k))cr.five=cr.five.filter(x=>x!==k);else{if(cr.four===k)cr.four='';cr.five=[...cr.five,k];}}
   else{cr.four=cr.four===k?'':k;cr.five=cr.five.filter(x=>x!==k);}
   const ups={...cr.ups};touched.forEach(x=>delete ups[x]);cr.ups=ups;
   if(refund)toast('Refunded '+refund+' XP from that skill\u2019s XP improvements. Buy them again if you still want them.');
   break;}
  case 'up':{const r=crRating(k),cost=SKILL_COST[r];if(!cost||r-1<crFloor(k))return;if(crXpSpent()+cost>crXpBudget())return toast('Not enough XP. That costs '+cost+'.');cr.ups={...cr.ups,[k]:(cr.ups[k]||0)+1};break;}
  case 'down':cr.ups={...cr.ups,[k]:Math.max(0,(cr.ups[k]||0)-1)};break;
  case 'kbuy':{const sel=document.getElementById('cr-kbuy');if(!sel||!sel.value)return toast('Choose a knack first.');kpickSel.cr='';const kk=A.knacksFor(cr.archetype).find(x=>x.name===sel.value);if(!kk)return;
   if(crTierCount(kk.tier)>=KNACK_CAP[kk.tier])return toast('Limit reached for tier '+kk.tier+'.');
   for(let t=1;t<kk.tier;t++)if(!crTierCount(t))return toast('You need a tier '+t+' knack first.');
   if(crXpSpent()+KNACK_COST[kk.tier]>crXpBudget())return toast('Not enough XP. That costs '+KNACK_COST[kk.tier]+'.');
   cr.bought=[...cr.bought,kk.name];break;}
  case 'kdel':cr.bought=cr.bought.filter(x=>x!==n);break;
  case 'cat':cr.cat=n;break;
  case 'addw':{const w=W()[Number(n)];if(crMoneySpent()+w.c>crMoneyBudget())return toast('Over budget. '+w.n+' costs '+money(w.c)+'.');cr.cart=[...cr.cart,{type:'w',n:w.n,c:w.c}];break;}
  case 'addg':{const g=GR()[Number(n)];if(crMoneySpent()+g.c>crMoneyBudget())return toast('Over budget. '+g.n+' costs '+money(g.c)+'.');cr.cart=[...cr.cart,{type:'g',n:g.n,c:g.c}];break;}
  case 'addr':{const it=cr.cart[Number(n)];const w=W().find(x=>x.n===it.n);if(crMoneySpent()+w.rc>crMoneyBudget())return toast('Over budget.');cr.cart=[...cr.cart,{type:'reload',n:w.n,c:w.rc}];break;}
  case 'rm':cr.cart=cr.cart.filter((x,i)=>i!==Number(n));break;
  case 'reset':crDone();break;
  case 'place':{if(cr.slot==='new'){const c=crBuild();addSlot(c).then(id=>{if(!id)return;crDone();toast(c.name+' joined the party.');go(id);});return;}
   if(!canEdit(cr.slot))return toast(chars[cr.slot].name+'\u2019s sheet is locked. Unlock it first.');const c=crBuild();const s=cr.slot;c.locked=!!chars[s].locked;if(CAMP)c.ownerUid=chars[s].ownerUid||authUid;chars[s]=norm(c,slotNum(s));if(db)db.doc('characters/'+s).set(JSON.parse(JSON.stringify(chars[s]))).catch(e=>toast(e&&e.code==='permission-denied'?'That slot is locked. Unlock it first.':'Couldn’t save the new investigator. Try again.'));
   crDone();toast(c.name+' joined the party.');go(s);return;}
  case 'print':downloadSheet(crBuild());return;
 }
 crSave();render();
}
function downloadSheet(c){
 const html=A.sheetHtml(c);
 // Hand the sheet to print.html on this same (secure) site through this browser's storage.
 let id=null;
 try{
  const now=Date.now();
  for(let k=localStorage.length-1;k>=0;k--){const key=localStorage.key(k);if(key&&key.indexOf('apl-print:')===0&&now-Number(key.split(':')[1]||0)>86400000)localStorage.removeItem(key);}
  id=String(now);localStorage.setItem('apl-print:'+id,html);
 }catch(e){id=null;}
 if(id){const w=window.open('print.html#'+id,'_blank');if(w){toast('Sheet opened in a new tab. Use its Print button.');return;}}
 // Fallback: blob tab, then download.
 const blob=new Blob([html],{type:'text/html'});const url=URL.createObjectURL(blob);
 const w2=window.open(url,'_blank');
 if(w2){toast('Sheet opened in a new tab. Use its Print button.');setTimeout(()=>URL.revokeObjectURL(url),60000);return;}
 const a=document.createElement('a');a.href=url;a.download=(c.name||'Investigator').replace(/[^\w .-]/g,'')+' - Arkham sheet.html';document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Your browser blocked the new tab, so the sheet was downloaded instead.');
}

// ---------- passcodes ----------
async function grant(slot,code){await db.doc('grants/'+authUid+'/keys/'+slot).set({slot,code});}
async function lockAction(a,s){
 if(!db||!authUid)return toast('Still connecting. Try again in a moment.');
 const val=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
 try{
  if(a==='unlock'){const code=val('unlock-'+s);if(!code)return toast('Enter the passcode.');await grant(s,code);toast('Unlocked on this device.');}
  else if(a==='munlock'){const code=val('mkey');if(!code)return toast('Enter the master key.');await grant('master',code);toast('Master key active on this device.');}
  else if(a==='lockset'){const code=val('lockset-'+s);if(code.length<4)return toast('Use at least 4 characters.');
   await db.doc('locks/'+s).set({code});await grant(s,code);if(!chars[s].locked)await db.doc('characters/'+s).update({locked:true});toast(chars[s].locked?'Passcode set.':'Passcode changed.');}
  else if(a==='lockoff'){await db.doc('characters/'+s).update({locked:false});await db.doc('locks/'+s).delete();await db.doc('grants/'+authUid+'/keys/'+s).delete().catch(()=>{});toast('Passcode removed. Anyone can edit this sheet.');}
  else if(a==='forget'){await db.doc('grants/'+authUid+'/keys/'+s).delete();toast('This device needs the passcode again to edit.');}
  else if(a==='gmset'){const code=val('gmpin');if(code.length<4)return toast('Use at least 4 characters.');
   await db.doc('locks/gm').set({code});await grant('gm',code);await db.doc('settings/gm').set({set:true});gmLog(gmClaimed?'GM PIN changed':'GM PIN set',false);toast(gmClaimed?'GM PIN changed.':'GM PIN set. The GM tools are unlocked on this device.');}
  else if(a==='gmunlock'){const code=val('gmpin');if(!code)return toast('Enter the GM PIN.');await grant('gm',code);toast('GM tools unlocked on this device.');}
  else if(a==='gmforget'){await db.doc('grants/'+authUid+'/keys/gm').delete();toast('GM PIN removed from this device.');}
  else if(a==='gmclear'){gmLog('GM PIN removed',false);await db.doc('settings/gm').set({set:false});await db.doc('locks/gm').delete();await db.doc('grants/'+authUid+'/keys/gm').delete().catch(()=>{});toast('GM PIN removed. The next GM can set their own.');}
  else if(a==='gmreset'){await db.doc('settings/gm').set({set:false});await db.doc('locks/gm').delete();toast('GM PIN cleared. The GM can choose a new one.');}
  else if(a==='mforget'){await db.doc('grants/'+authUid+'/keys/master').delete();toast('Master key removed from this device.');}
 }catch(e){const code=(e&&e.code)||'unknown';console.warn('lock action failed',a,e);toast(code==='permission-denied'?(a==='munlock'?'That master key isn\u2019t right.':a==='unlock'?'Wrong passcode.':a==='gmunlock'?'That GM PIN isn\u2019t right.':a==='gmset'&&gmClaimed&&!isGM()?'A GM PIN is already set.':'Firebase refused that change (permission-denied). Check the site says v95 and the rules are up to date.'):'Couldn\u2019t do that ('+code+'). Try again.');}
}

// subscriptions that depend on whether this device holds the master key

 gmUnsubs.forEach(u=>{try{u();}catch(e){}});gmUnsubs=[];
 const eq=m?db.collection('enemies'):db.collection('enemies').where('shown','==',true);

 else{const got={};const put=()=>{clues={};Object.values(got).forEach(o=>Object.assign(clues,o));render();};

function turnBar(){

 return '<div class="turnbar'+(table.phase==='adversaries'?' adv':'')+'" role="status"><span>'+(table.scene?'<b>'+esc(table.scene)+'</b>':'')+(table.fight?' <span class="chip warn">'+(table.phase==='surprise'?'Fight · surprise round':'Fight · round '+Math.max(1,table.round))+'</span>':' <span class="chip">Narrative scene</span>')+'</span>'+(ph?'<span class="ph">'+ph+'</span>':'')+'</div>';
}
function refillChar(s,n){const c=chars[s];if(!c||!gmCan(s))return;const cur=c.regular+c.horror;const want=n==null?c.poolLimit:Math.min(c.poolLimit,cur+n);if(want<=cur&&n!=null)return;
 let h=Math.min(c.horrorLimit,want),r=want-h;if(n!=null){h=Math.max(c.horror,Math.min(c.horrorLimit,c.horror+(want-cur)));r=want-h;}
 save(s,{horror:h,regular:r});}
function refillEnemy(e,n){const cur=e.regular+e.horror;const want=n==null?e.limit:Math.min(e.limit,cur+n);let h=Math.min(e.horrorLimit||0,want);if(n!=null)h=Math.max(e.horror,Math.min(e.horrorLimit||0,e.horror+Math.max(0,want-cur)));
 updEnemy(e.id,{horror:h,regular:Math.max(0,want-h)});}
function refillSide(side,n){if(side==='investigators')SLOTS.forEach(s=>refillChar(s,n));else Object.values(enemies).filter(e=>!e.out).forEach(e=>refillEnemy(e,n));}

 if(sur!=='none'){const other=sur==='investigators'?'adversaries':'investigators';if(table.auto)refillSide(other,1);saveTable({fight:true,phase:'surprise',round:0,first});gmLog('Fight started: the '+sur+' were surprised',true);toast('Surprise round: '+(other==='investigators'?'investigators':'adversaries')+' add 1 die. The surprised side doesn’t refill.');}
 else{if(table.auto)refillSide(first);saveTable({fight:true,phase:first,round:1,first});gmLog('Fight started: '+first+' go first',true);}}

 else{ph=table.phase==='investigators'?'adversaries':'investigators';if(ph===table.first)round++;}
 if(table.auto)refillSide(ph);if(round!==table.round)gmLog('Round '+round,false);saveTable({phase:ph,round});}

function npcProfile(n){return NPCS.find(x=>x.n===n);}
function addEnemies(){const p=npcProfile(gm.addN);const count=Math.max(1,Math.min(12,Number(gm.addCount)||1));
 const base=p?p.pool:4;const pool=gm.addScale?Math.min(8,base+SLOTS.length):base;
 const existing=Object.values(enemies).filter(e=>e.base===(p?p.n:'Custom enemy')).length;
 for(let i=0;i<count;i++){const id=gmId()+i;const hl=(p&&p.horror)||0;
  const e={id,base:p?p.n:'Custom enemy',n:(p?p.n:'Enemy')+(count>1||existing?' '+(existing+i+1):''),type:p?p.type:'Minor',max:pool,limit:pool,regular:pool-Math.min(hl,pool),horror:Math.min(hl,pool),horrorLimit:hl,injuries:[],traumas:[],strained:false,out:false,shown:false,t:Date.now()+i,note:''};
  enemies[id]=e;gmSet('enemies/'+id,e);}
 gmLog('Added '+count+' \u00d7 '+(p?p.n:'custom enemy'),false);gm.addCount=1;render();toast('Added '+count+' '+(p?p.n:'enemy')+(count>1?'s':'')+'.');}
function updEnemy(id,p){const e=enemies[id];if(!e)return;Object.assign(e,p);render();gmSet('enemies/'+id,p,true);}
function enemyClamp(e){e.limit=Math.max(0,Math.min(e.max,e.limit));let over=e.regular+e.horror-e.limit;while(over>0&&e.regular>0){e.regular--;over--;}while(over>0&&e.horror>0){e.horror--;over--;}}
function enemyDamage(e,n){if(e.out)return;e.limit-=n;enemyClamp(e);const p={limit:e.limit,regular:e.regular,horror:e.horror};
 if(e.limit===0){if(e.type==='Minor'){p.out=true;toast(e.n+' is out: killed or knocked unconscious (your call).');}
  else if(e.type==='Major'||e.type==='Monstrous'){if(e.strained){p.out=true;toast(e.n+' is out: killed or knocked unconscious (your call).');}else toast(e.n+' is wounded. As a Major NPC it can strain once to get its pool back.');}

// ---------- hidden dice roller ----------
function rollDice(){const n=Math.max(1,Math.min(20,Number(gm.rollN)||1)),t=Math.max(2,Math.min(6,Number(gm.rollT)||4)),hz=Math.max(0,Math.min(n,Number(gm.rollH)||0)),mod=Number(gm.rollMod)||0;
 const dice=[];for(let i=0;i<n;i++){const v=1+Math.floor(Math.random()*6);dice.push({v,h:i<hz,s:Math.max(1,Math.min(6,v+mod))>=t});}
 gm.roll={dice,t,mod,succ:dice.filter(d=>d.s).length,ones:dice.filter(d=>d.v===1).length,hones:dice.filter(d=>d.h&&d.v===1).length,sixes:dice.filter(d=>d.v===6).length};render();}

function clueHtml(c,master){

 return '<div class="clue'+(master&&!c.shown?' draft':'')+'">'+(master?'<div class="row" style="justify-content:space-between"><span class="chip'+(c.shown?' ok':'')+'">'+(c.shown?'Revealed':'Not revealed yet')+'</span><div class="row" style="gap:6px"><button class="btn sm'+(c.shown?'':' pri')+'" data-gact="cshow" data-id="'+c.id+'">'+(c.shown?'Hide again':'Reveal')+'</button><button class="btn sm icon" data-gact="cdel" data-id="'+c.id+'" aria-label="Delete clue">×</button></div></div>':'')+
  '<h3>'+esc(c.title||'Untitled')+'</h3>'+(to?'<div class="note">For '+esc(to)+'</div>':'')+(c.img?'<img src="'+c.img+'" alt="'+esc(c.title||'Handout')+'" class="handout">':'')+(c.body?'<p style="white-space:pre-wrap;margin:6px 0 0">'+esc(c.body)+'</p>':'')+'</div>';

function pickClueImage(f){if(!f||!/^image\//.test(f.type))return toast('Choose an image file.');const url=URL.createObjectURL(f);const img=new Image();
 img.onload=()=>{let w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,1200/Math.max(w,h));const cv=document.createElement('canvas');
  let q=0.82,d='';for(let k=0;k<6;k++){cv.width=Math.round(w*s);cv.height=Math.round(h*s);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);d=cv.toDataURL('image/jpeg',q);if(d.length<900000)break;s*=0.8;q-=0.05;}
  URL.revokeObjectURL(url);gm.clueImg=d;render();};img.onerror=()=>toast('Couldn’t read that image.');img.src=url;}
const clueName=c=>'\u201c'+(c.title||(c.body||'').slice(0,40)||'picture')+'\u201d';
const clueWho=c=>c.to==='all'?'everyone':((chars[c.to]&&chars[c.to].name)||c.to);
function clueLog(c){if(c.shown){gmLog('Revealed clue '+clueName(c)+' to '+clueWho(c),false);if(c.to==='all')gmStory('Found '+clueName(c));}else gmLog('Hid clue '+clueName(c),false);}
function addClue(show){const t=(document.getElementById('cl-title')||{}).value||'',b=(document.getElementById('cl-body')||{}).value||'';
 if(!t.trim()&&!b.trim()&&!gm.clueImg)return toast('Write a clue or add a picture first.');
 const id=gmId();const c={id,title:t.trim(),body:b.trim(),img:gm.clueImg,to:gm.clueTo||'all',shown:!!show,t:Date.now()};clues[id]=c;gm.clueImg='';gmSet('clues/'+id,c);if(show)clueLog(c);else gmLog('Saved clue '+clueName(c)+' (hidden)',false);
 const ti=document.getElementById('cl-title'),bo=document.getElementById('cl-body');if(ti)ti.value='';if(bo)bo.value='';render();toast(show?'Clue revealed to the players.':'Clue saved. Reveal it when they find it.');}

 h+='<section class="sec"><div class="sec-head"><h2>Session recap</h2></div><div class="row"><label class="field"><span class="lbl">Session</span><select class="f" data-grecap="1"><option value="">Choose…</option>'+ss.map(i=>'<option value="'+i+'"'+(historySession===i?' selected':'')+'>Session '+i+'</option>').join('')+'</select></label>'+(historySession&&history.length?'<button class="btn sm" data-gact="copyrecap">Copy as text</button>':'')+'</div>';
 if(historySession){
  h+=history.length?'<div class="grid2">'+recapGroups().map(([n,a])=>'<div><span class="lbl">'+esc(n)+'</span><ul class="recap">'+a.map(x=>'<li>'+esc(x.m)+'</li>').join('')+'</ul></div>').join('')+'</div>':'<p class="note" style="margin:0">Nothing logged for session '+historySession+'. (Recaps start from when this feature was added.)</p>';}
 h+='</section>';
 // campaign
 h+='<section class="sec"><div class="sec-head"><h2>Campaign</h2><span class="note">Players can read this on the Journal tab.</span></div><label class="field" style="max-width:320px"><span class="lbl">In-game date</span><input class="f" id="cp-date" data-gcpd="1" value="'+esc(campaign.date)+'" placeholder="e.g. Friday, October 14, 1927"></label>'+campaignHtml(true)+'</section>';
 // notes
 h+='<section class="sec"><div class="sec-head"><h2>GM notes</h2><span class="note">Private: only the GM (and the '+(CAMP?'campaign owner':'master key')+') can read these.</span></div><textarea class="f" id="gm-notes" data-gnotes="1" rows="8"'+(isGM()?'':' readonly')+' placeholder="Secrets, plans, NPC motives…">'+esc(gmNotes)+'</textarea></section>';
 // activity
 const g=isGM(),tf=t=>new Date(t).toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'});
 h+='<section class="sec"><div class="sec-head"><h2>Recent</h2><span class="note">Only the GM and the '+(CAMP?'campaign owner':'master key')+' see this.</span>'+(g&&gmLogList.length?'<button class="btn sm dng" data-gact="glclear">Clear all</button>':'')+'</div><div class="log">'+(gmLogList.length?gmLogList.map(l=>'<span class="row" style="gap:6px;flex-wrap:nowrap">'+(g?'<button class="btn sm icon" style="min-height:24px;width:24px" data-gact="gldel" data-id="'+esc(l.id)+'" aria-label="Remove this entry">\u00d7</button>':'')+'<span>'+tf(l.t)+' \u2014 '+esc(l.m)+'</span></span>').join(''):'Nothing yet.')+'</div></section>';
 return h;
}

// ---------- GM clicks and edits ----------
function gmClick(b){const a=b.dataset.gact,id=b.dataset.id,n=Number(b.dataset.n),e=id&&enemies[id];
 if(!isGM()&&!['eopen','copyrecap'].includes(a))return toast('Only the GM can change this.');
 switch(a){
  case 'fight':startFight();break;
  case 'next':nextTurn();break;
  case 'endfight':gmLog('Fight ended after '+Math.max(1,table.round)+' round'+(table.round>1?'s':''),true);saveTable({fight:false,phase:'',round:0});break;
  case 'endscene':if(table.scene)gmLog('Scene ended: '+table.scene,false);saveTable({scene:'',fight:false,phase:'',round:0});break;
  case 'eadd':if(gm.addN==='__custom'){gm.addN='';addEnemies();}else addEnemies();break;
  case 'eopen':gm.open[id]=!gm.open[id];render();break;
  case 'eshow':if(e){gmLog((e.shown?'Hid ':'Showed ')+e.n+(e.shown?' from':' to')+' the players',false);if(!e.shown)gmStory('Encountered '+e.n);updEnemy(id,{shown:!e.shown});}break;
  case 'edel':if(e){gmLog('Removed '+e.n,false);delete enemies[id];render();gmDel('enemies/'+id);}break;
  case 'eclearall':if(Object.keys(enemies).length)gmLog('Cleared all enemies',false);Object.keys(enemies).forEach(k=>gmDel('enemies/'+k));enemies={};render();break;
  case 'espend':if(e){if(e.regular>0)updEnemy(id,{regular:e.regular-1});else if(e.horror>0)updEnemy(id,{horror:e.horror-1});}break;
  case 'erefill':if(e)refillEnemy(e);break;
  case 'erefillall':Object.values(enemies).filter(x=>!x.out).forEach(x=>refillEnemy(x));break;
  case 'edmg':if(e)enemyDamage(e,1);break;
  case 'eheal':if(e&&e.limit<e.max)gmLog(e.n+' healed 1',false),updEnemy(id,{limit:e.limit+1});break;
  case 'estrain':if(e)gmLog(e.n+' strained to fight on',!!e.shown),updEnemy(id,{limit:e.max,strained:true});break;
  case 'eback':if(e)gmLog(e.n+' is back in the fight',false),updEnemy(id,{out:false,limit:Math.max(1,e.limit)});break;
  case 'emax':if(e){const m=Math.max(1,Math.min(12,e.max+n));const lim=e.limit===e.max?m:Math.min(e.limit,m);e.max=m;e.limit=lim;enemyClamp(e);updEnemy(id,{max:m,limit:e.limit,regular:e.regular,horror:e.horror});}break;
  case 'ehl':if(e)updEnemy(id,{horrorLimit:Math.max(0,Math.min(e.max,(e.horrorLimit||0)+n))});break;
  case 'eclear':if(e)updEnemy(id,{injuries:[],traumas:[]});break;
  case 'roll':rollDice();break;
  case 'cadd':addClue(n===1);break;
  case 'cshow':{const c=clues[id];if(c){c.shown=!c.shown;clueLog(c);render();gmSet('clues/'+id,{shown:c.shown},true);}break;}
  case 'cdel':if(clues[id])gmLog('Deleted clue '+clueName(clues[id]),false);delete clues[id];render();gmDel('clues/'+id);break;
  case 'climgdel':gm.clueImg='';render();break;
  case 'cpadd':{const l=b.dataset.list;campaign[l]=[...(campaign[l]||[]),{id:gmId()}];saveCampaign();break;}
  case 'cpdel':{const l=b.dataset.list;campaign[l]=(campaign[l]||[]).filter(x=>x.id!==id);saveCampaign();break;}
  case 'cpdone':campaign.threads=(campaign.threads||[]).map(x=>x.id===id?{...x,done:!x.done}:x);saveCampaign();break;
  case 'wrapall':SLOTS.forEach(s=>{gm.wrap[s]={...(gm.wrap[s]||{mom:false}),xp:gm.wrap.hours||4};});render();break;
  case 'award':awardSession();break;
  case 'nextsession':SLOTS.filter(gmCan).forEach(x=>R.newSession(x,true));saveTable({session:(table.session||1)+1,scene:'',fight:false,phase:'',round:0});gmLog('Session '+table.session+' started',false);gm.wrap={};toast('Session '+table.session+' started.');break;
  case 'gldel':gmLogList=gmLogList.filter(x=>x.id!==id);render();gmDel('gmlog/'+id);break;
  case 'glclear':gmLogList.forEach(x=>gmDel('gmlog/'+x.id));gmLogList=[];render();break;
  case 'copyrecap':{const t=recapText();try{navigator.clipboard.writeText(t).then(()=>toast('Recap copied.'),()=>toast('Couldn’t copy. Select the text instead.'));}catch(x){toast('Couldn’t copy. Select the text instead.');}break;}
 }
}
let notesT=null;
function gmChange(el){
 if(!isGM()&&(el.dataset.gt||el.dataset.gen||el.dataset.geinj||el.dataset.getra||el.dataset.gimg||el.dataset.gcp||el.dataset.gcpd||el.dataset.gnotes||el.dataset.gwrap)){toast('Only the GM can change this.');render();return true;}
 if(el.dataset.gs){const k=el.dataset.gs;gm[k]=el.type==='checkbox'?el.checked:el.value;render();return true;}
 if(el.dataset.gt){const k=el.dataset.gt;if(k==='scene'&&el.value.trim()&&el.value.trim()!==table.scene)gmLog('Scene: '+el.value.trim(),true);saveTable({[k]:el.type==='checkbox'?el.checked:el.value.trim()});return true;}
 if(el.dataset.gen){updEnemy(el.dataset.gen,{[el.dataset.k]:el.value});return true;}
 if(el.dataset.geinj){const e=enemies[el.dataset.geinj];if(e&&el.value){gmLog(e.n+' suffered injury: '+el.value,!!e.shown);const inj=[...e.injuries,el.value];const p={injuries:inj};if(el.value==='Comatose'||el.value==='Dire'){e.limit=0;enemyClamp(e);Object.assign(p,{limit:0,regular:e.regular,horror:e.horror});}updEnemy(e.id,p);}return true;}
 if(el.dataset.getra){const e=enemies[el.dataset.getra];if(e&&el.value)gmLog(e.n+' suffered trauma: '+el.value,!!e.shown),updEnemy(e.id,{traumas:[...e.traumas,el.value]});return true;}
 if(el.dataset.gimg){pickClueImage(el.files&&el.files[0]);el.value='';return true;}
 if(el.dataset.gcp){const l=el.dataset.gcp;campaign[l]=(campaign[l]||[]).map(x=>x.id===el.dataset.id?{...x,[el.dataset.k]:el.value}:x);saveCampaign();return true;}
 if(el.dataset.gcpd){campaign.date=el.value;saveCampaign();return true;}
 if(el.dataset.gnotes){gmNotes=el.value;gmSet('gm/notes',{text:gmNotes});return true;}
 if(el.dataset.gwrap){const s=el.dataset.gwrap;if(s==='hours'){gm.wrap.hours=Math.max(0,Number(el.value)||0);return true;}
  const x=gm.wrap[s]||(gm.wrap[s]={xp:gm.wrap.hours||4,mom:false});if(el.dataset.k==='mom')x.mom=el.checked;else x.xp=Math.max(0,Number(el.value)||0);return true;}
 if(el.dataset.grecap){if(el.value)loadRecap(Number(el.value));else{historySession=null;render();}return true;}
 return false;
}

// ---------- campaign boot (beta) ----------
async function bootCampaign(syncEl){
 const cfg0=window.FIREBASE_CONFIG;
 if(!cfg0||!cfg0.projectId||!window.firebase){localMode=true;render();syncEl.textContent='Not connected';return;}
 const cfg=Object.assign({},cfg0);if(/\.web\.app$|\.firebaseapp\.com$/.test(location.hostname))cfg.authDomain=location.hostname;
 const fb=firebase.initializeApp(cfg,'beta');const raw=fb.firestore();const pre='campaigns/'+CAMP+'/';
 const u=await new Promise(res=>{const off=fb.auth().onAuthStateChanged(x=>{off();res(x);});});
 if(!u||u.isAnonymous){location.replace('beta/');return;}
 authUid=u.uid;
 db={doc:p=>raw.doc(pre+p),collection:p=>raw.collection(pre+p),batch:()=>raw.batch()};
 const brand=document.querySelector('.brand h1');
 raw.doc('campaigns/'+CAMP).onSnapshot(snap=>{
  if(!snap.exists){halted='This campaign was deleted.';render();return;}
  camp=snap.data();
  if(!(camp.memberIds||[]).includes(authUid)){halted='You\u2019re not in this campaign. Ask its owner for an invite link.';render();return;}
  if(brand)brand.textContent=camp.name;document.title=camp.name+' \u2014 Arkham Ledger';
  applyRoles();if(window.__syncLine)window.__syncLine();render();
 },()=>{halted='You\u2019re not in this campaign. Ask its owner for an invite link.';render();});
 gmBoot();
 db.doc('settings/house').onSnapshot(snap=>{house={on:!!(snap.exists&&snap.data().on)};render();},()=>{});
 db.collection('characters').onSnapshot(qs=>{
  const ids=[];
  qs.forEach(d=>{if(!isSlotId(d.id))return;ids.push(d.id);chars[d.id]=norm(JSON.parse(JSON.stringify(d.data())),slotNum(d.id));});
  if(!ids.length&&qs.metadata.fromCache)return;
  SLOTS=ids.sort((a,b)=>slotNum(a)-slotNum(b));
  Object.keys(chars).forEach(k=>{if(!SLOTS.includes(k))delete chars[k];});
  if(pendingTab&&SLOTS.includes(pendingTab)){active=pendingTab;pendingTab=null;}
  if(isSlotId(active)&&!SLOTS.includes(active)){active='party';edit.rm=null;}
  applyRoles();render();saveCache();
 },err=>{if(err&&err.code==='permission-denied'){halted='You\u2019re not in this campaign. Ask its owner for an invite link.';render();}else syncEl.textContent='Sync paused \u2014 reload to reconnect';});
 const syncLine=()=>{syncEl.innerHTML='Live \u00b7 <a href="beta/">My campaigns</a> \u00b7 <a href="beta/?settings='+encodeURIComponent(CAMP)+'">'+(camp&&camp.ownerUid===authUid?'Campaign settings':'Members')+'</a> \u00b7 v95';};syncLine();window.__syncLine=syncLine;
}

// ---------- boot ----------
render();
(async()=>{
 const syncEl=document.getElementById('sync');
 if(CAMP){await bootCampaign(syncEl);return;}
 const cfg=window.FIREBASE_CONFIG;
 if(!cfg||!cfg.projectId||cfg.projectId.startsWith('PASTE')||!window.firebase){localMode=true;render();syncEl.textContent='Not connected — add your Firebase settings (see README)';return;}
 try{firebase.initializeApp(cfg);db=firebase.firestore();}catch(e){db=null;localMode=true;render();syncEl.textContent='Couldn’t connect to Firebase — check the settings';return;}
 try{const cred=await firebase.auth().signInAnonymously();authUid=cred.user.uid;}catch(e){syncEl.textContent='Sign-in failed — turn on Anonymous sign-in in Firebase (see README)';db=null;localMode=true;render();return;}
 watchKeys();
 gmBoot();
 db.doc('settings/gm').onSnapshot(snap=>{gmClaimed=!!(snap.exists&&snap.data().set);gmFlagReady=true;saveCache();gmMasterState=null;gmSubscribe();render();},()=>{gmFlagReady=true;render();});
 db.doc('settings/house').onSnapshot(snap=>{house={on:!!(snap.exists&&snap.data().on)};render();},()=>{});
 syncEl.textContent='Live · synced for the party · v95';
 const legacy=()=>{rosterLocked=true;SLOTS=['p1','p2','p3','p4'];SLOTS.forEach((s,i)=>{
  const ref=db.doc('characters/'+s);let created=false;
  ref.onSnapshot(snap=>{
   if(!snap.exists){ if(!created&&!snap.metadata.fromCache){created=true;ref.set(SEED[s]||blank(i+1)).catch(()=>{});} return; }
   chars[s]=norm(JSON.parse(JSON.stringify(snap.data())),i+1);render();saveCache();
  },err=>{syncEl.textContent='Sync paused — reload to reconnect';});
 });render();};
 let seeded=false;
 db.collection('characters').onSnapshot(qs=>{
  const ids=[];
  qs.forEach(d=>{if(!isSlotId(d.id))return;ids.push(d.id);chars[d.id]=norm(JSON.parse(JSON.stringify(d.data())),slotNum(d.id));});
  if(!ids.length&&!qs.metadata.fromCache&&!seeded){seeded=true;['p1','p2','p3','p4'].forEach((s,i)=>db.doc('characters/'+s).set(SEED[s]||blank(i+1)).catch(()=>{}));return;}
  if(!ids.length&&qs.metadata.fromCache)return;
  SLOTS=ids.sort((a,b)=>slotNum(a)-slotNum(b));
  Object.keys(chars).forEach(k=>{if(!SLOTS.includes(k))delete chars[k];});
  if(pendingTab&&SLOTS.includes(pendingTab)){active=pendingTab;pendingTab=null;}
  if(isSlotId(active)&&!SLOTS.includes(active)){active='party';edit.rm=null;}
  render();saveCache();
 },err=>{if(err&&err.code==='permission-denied')legacy();else syncEl.textContent='Sync paused — reload to reconnect';});
})();
})();
